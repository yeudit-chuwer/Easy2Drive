        </div>
        
    </div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

     	// Case: User tried to access internal pages without logging in
        if (error === 'unauthorized') {
            alert("גישה אסורה! עליך להתחבר למערכת כדי לצפות בדף זה.");
        } 
       	// Case: Student record not found in the database
        else if (error === 'notfound') {
            alert("התלמיד לא קיים במערכת. יש לפנות למורה.");
        }

        if (error) {
            const newUrl = window.location.pathname;
            window.history.replaceState({}, document.title, newUrl);
        }
        
     	// URL Cleanup: Removes the error parameter from the address bar for a cleaner look
        if (urlParams.get('info') === 'loggedout') {
           
        }
    });
</script>
