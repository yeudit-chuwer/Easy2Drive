<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy2Drive - התשלומים שלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="js/loader.js"></script>
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .multiply-logo { mix-blend-mode: multiply; }
    </style>
</head>
<body class="text-right">

    <nav class="bg-white border-b sticky top-0 z-50 px-4 md:px-8 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img src="images/logo1.jpg" alt="Logo" class="h-10 md:h-12 object-contain multiply-logo">
            <span class="font-bold text-gray-700 border-r pr-3 mr-1">התשלומים שלי</span>
        </div>
        <button onclick="location.href='student_dashboard.html?phone=' + window.studentPhone" class="text-gray-600 hover:text-blue-600 flex items-center gap-2 font-bold transition">
    		<i data-lucide="arrow-right" class="w-5 h-5"></i>
             חזרה ליומן			
      </button>
    </nav>

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">סיכום כספי</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="bg-white p-6 rounded-3xl border border-green-100 card-shadow flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-500 font-bold">סה"כ שילמתי</p>
                    <p id="totalPaid" class="text-3xl font-black text-green-600">₪0</p>
                </div>
                <div class="p-4 bg-green-50 rounded-2xl text-green-600">
                    <i data-lucide="check-circle" class="w-8 h-8"></i>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-yellow-100 card-shadow flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-500 font-bold">יתרת חוב</p>
                    <p id="totalDebt" class="text-3xl font-black text-yellow-600">₪0</p>
                </div>
                <div class="p-4 bg-yellow-50 rounded-2xl text-yellow-600">
                    <i data-lucide="clock" class="w-8 h-8"></i>
                </div>
            </div>
        </div>

        <div id="unpaidSection" class="mb-10 hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center gap-2">
                <i data-lucide="alert-triangle" class="text-yellow-500"></i>
                שיעורים שממתינים לתשלום
            </h2>
            <div id="unpaidList" class="space-y-3">
                </div>
            <div class="mt-4 p-4 bg-blue-50 rounded-2xl border border-blue-100 text-center">
                <p class="text-sm text-blue-700 font-medium">💡 יש להסדיר את התשלום מול המורה בסיום השיעור</p>
            </div>
        </div>

        <div class="bg-white rounded-3xl border card-shadow overflow-hidden">
            <div class="p-6 border-b bg-gray-50/50">
                <h2 class="text-xl font-bold text-gray-800">היסטוריית פעולות</h2>
            </div>
            <div id="paymentsHistory" class="divide-y">
                <div class="p-12 text-center text-gray-400 italic">
                    <p>אין תשלומים רשומים במערכת</p>
                </div>
            </div>
        </div>
    </main>

    <script>
		 // Initialize Lucide icons
        lucide.createIcons();

        window.studentPhone = new URLSearchParams(window.location.search).get('phone');

        // Data containers for database results
        let payments = []; // { id, amount, date, status }
        let unpaidLessons = []; // { id, date, time, price }

        /**
         * UI RENDERER
         * Dynamically populates the unpaid section, history list, and summary cards.
         */
        function renderStudentData() {
            const unpaidList = document.getElementById('unpaidList');
            const unpaidSection = document.getElementById('unpaidSection');
            const historyContainer = document.getElementById('paymentsHistory');

         // 1. Process Unpaid Lessons
            if (unpaidLessons.length > 0) {
                unpaidSection.classList.remove('hidden');
                unpaidList.innerHTML = unpaidLessons.map(lesson => `
                    <div class="flex items-center justify-between p-4 border rounded-2xl bg-yellow-50/50 border-yellow-100">
                        <div>
                            <p class="font-bold text-gray-800">${lesson.date}</p>
                            <p class="text-xs text-gray-500">${lesson.time}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-black text-lg">₪${lesson.price}</span>
                            <div class="p-2 bg-yellow-100 rounded-full text-yellow-600">
                                <i data-lucide="clock" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                unpaidSection.classList.add('hidden');
            }

            // 2. Process Payment History
            if (payments.length > 0) {
                historyContainer.innerHTML = payments.map(payment => `
                    <div class="p-5 flex justify-between items-center hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4">
                            <div class="p-2 rounded-full ${payment.status === 'paid' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                <i data-lucide="${payment.status === 'paid' ? 'check' : 'x-circle'}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <p class="font-bold text-gray-800">${payment.status === 'paid' ? 'בוצע תשלום' : 'תשלום בוטל'}</p>
                                <p class="text-xs text-gray-400 font-medium">${payment.date}</p>
                            </div>
                        </div>
                        <p class="font-black text-xl text-gray-700 font-mono">₪${payment.amount}</p>
                    </div>
                `).join('');
            }

            // 3. Update Financial Summary Cards
            const totalPaid = payments
                .filter(p => p.status === 'paid')
                .reduce((sum, p) => sum + p.amount, 0);
            
            const totalDebt = unpaidLessons
                .reduce((sum, l) => sum + l.price, 0);

            document.getElementById('totalPaid').innerText = `₪${totalPaid}`;
            document.getElementById('totalDebt').innerText = `₪${totalDebt}`;

            lucide.createIcons();
        }

        /**
         * DATA FETCHING
         * Returns student payment records and unpaid sessions from GetStudentPaymentsServlet.
         */
        async function loadData() {
        	const phone = window.studentPhone;
		    if (!phone) return;
		
		    try {
		        const res = await fetch('GetStudentPaymentsServlet?phone=' + phone);
		        const data = await res.json();
		        
		       // Map server response to global state
		        payments = data.history; 
		        unpaidLessons = data.unpaid.map(l => ({
		            date: l.date,
		            time: l.time,
		            price: l.amount
		        }));
		        
		        renderStudentData();
		    } catch (e) {
		        console.error("Error loading student payments:", e);
		    }
		}

     // Initialize on page load
        window.onload = loadData;
    </script>
</body>
</html>
