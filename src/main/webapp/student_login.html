<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy2Drive - כניסת תלמיד</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="js/loader.js"></script>
    
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <div class="pt-10 pb-6 text-center">
            <div class="flex justify-center mb-4">
                <img src="images/logo2.jpg" alt="Logo" class="w-20 h-20 object-contain logo-cleanup">
            </div>
            <h2 class="text-2xl font-bold text-gray-800">כניסת תלמיד</h2>
        </div>

        <div class="px-8 pb-10 space-y-6">
        	<div id="errorMessage" class="hidden bg-red-50 border-r-4 border-red-500 p-4 rounded-xl mb-4">
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p id="errorText" class="text-red-700 text-sm font-bold"></p>
                </div>
            </div>
            
            <form action="StudentLoginServlet" method="POST" class="space-y-4">
                <div class="space-y-2">
                    <label for="phone" class="block text-sm font-medium text-gray-700">מספר טלפון</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="05X-XXXXXXX" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-left dir-ltr"
                    >
                    <p id="localError" class="text-red-500 text-xs mt-1 hidden font-bold">שדה חובה</p>
                </div>

                <button type="button" onclick="validateAndSubmit()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                    כניסה
                </button>
            </form>

            <div class="relative py-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-100"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-400">או</span></div>
            </div>

            <a href="index.html" class="flex items-center justify-center w-full py-3 text-gray-500 hover:text-blue-600 transition-colors">
                <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                חזרה לדף הבית
            </a>
        </div>
    </div>

    <script>
	    lucide.createIcons();

	    /**
	     * Validates the phone input field.
	     * If empty, triggers visual error state.
	     * If valid, submits the form to StudentLoginServlet.
	     */ 
	     
	    function validateAndSubmit() {
	        const phoneInput = document.getElementById('phone');
	        const localError = document.getElementById('localError');
	        
	        phoneInput.classList.remove('border-red-500');
	        localError.classList.add('hidden');

	        if (phoneInput.value.trim() === "") {
	            phoneInput.classList.add('border-red-500'); 
	            localError.classList.remove('hidden');    
	            return; 
	        }

	        phoneInput.closest('form').submit();
	    }
	
	    /**
         * Global Error Handling:
         * Checks the URL for 'error' parameters sent back from the Servlet.
         * Maps specific error codes to user-friendly Hebrew messages.
         */
	    const params = new URLSearchParams(window.location.search);
	    const error = params.get('error');
	    const errorDiv = document.getElementById('errorMessage');
	    const errorText = document.getElementById('errorText');
	
	    if (error && errorDiv && errorText) {
	        errorDiv.classList.remove('hidden'); 
	        
	        if (error === 'not_found' || error === 'notfound') {
                errorText.innerText = "מספר הטלפון לא נמצא. וודא שהמורה הוסיף אותך למערכת.";
            } else if (error === 'invalid_phone') {
                errorText.innerText = "נא להזין מספר טלפון תקין.";
            } else {
                errorText.innerText = "אירעה שגיאה בשרת או שהמשתמש אינו קיים.";
            }
        }
	</script>
</body>
</html>
