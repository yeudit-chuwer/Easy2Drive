<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy2Drive - תקלה במערכת</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
        .multiply-logo { mix-blend-mode: multiply; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-4 text-right">

    <div class="w-full max-w-md bg-white rounded-[32px] shadow-2xl p-10 border border-gray-100 text-center">
        
        <div class="flex justify-center mb-8">
            <img src="images/logo1.jpg" alt="Easy2Drive" class="h-28 object-contain multiply-logo">
        </div>

        <div class="mb-6 inline-flex items-center justify-center w-20 h-20 bg-blue-50 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <div class="mb-8">
            <h1 class="text-3xl font-black text-gray-800 mb-3">אופס, חלה תקלה</h1>
            <p class="text-gray-500 text-lg leading-relaxed">
                נראה שיש בעיה בחיבור למנוע... <br>
                אל דאגה, אנחנו כבר מטפלים בזה כדי להחזיר אותך לכביש בבטחה.
            </p>
        </div>

        <div class="space-y-4">
            <button onclick="window.location.href='index.html'" 
                    class="flex items-center justify-center w-full h-16 text-xl font-bold bg-blue-600 text-white rounded-2xl shadow-lg transition-all hover:scale-[1.02] hover:bg-blue-700 active:scale-95">
                חזרה למסך הבית
            </button>
        </div>

        <div class="mt-12 flex flex-col items-center gap-2">
            <div class="h-px w-16 bg-gray-100"></div>
            <p class="text-[10px] text-gray-400 tracking-widest uppercase font-bold">
                קוד שגיאה: 500 • מערכת Easy2Drive
            </p>
        </div>
    </div>

</body>
</html>
